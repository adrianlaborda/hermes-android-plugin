name: Official Hermes compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        hermes: ['f15c19c25f7409e749d6b38d5232f8969b78325e', 'main']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: .upstream/hermes-agent
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]' ruamel.yaml python-dotenv rich croniter platformdirs pydantic requests
      - run: python -m pytest tests -q
        env:
          HERMES_AGENT_SRC: ${{ github.workspace }}/.upstream/hermes-agent
