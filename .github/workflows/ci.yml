name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # weekly, to catch breaking changes in Hermes Agent main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} · Hermes ${{ matrix.hermes-name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
        hermes-name: [v0.21.7, main]
        include:
          - hermes-name: v0.21.7
            hermes: 71d34bad1045610252eda02ee79549436896e784
          - hermes-name: main
            hermes: main
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: .upstream/hermes-agent
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]' pyyaml ruamel.yaml python-dotenv rich croniter platformdirs pydantic requests
      - run: python -m pytest tests -q
        env:
          HERMES_AGENT_SRC: ${{ github.workspace }}/.upstream/hermes-agent
