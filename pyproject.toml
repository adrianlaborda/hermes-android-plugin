[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-android-plugin"
version = "0.5.1"
description = "Hermes Android durable Android inbox platform plugin"
requires-python = ">=3.11,<3.14"
dependencies = ["httpx>=0.28,<0.29", "PyJWT[crypto]>=2.13,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio", "aiohttp"]

[tool.setuptools]
packages = ["hermes_android"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
